name: semantic-dataset-bridge
on:
  push:
    paths:
      - '.github/workflows/semantic-dataset-bridge.yml'
  workflow_dispatch:

jobs:
  presto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and normalize English PRESTO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw out/presto
          curl -fL --retry 4 --retry-all-errors -o raw/presto.zip https://storage.googleapis.com/gresearch/presto/presto_v1.zip
          sha256sum raw/presto.zip > out/presto/SOURCE_SHA256.txt
          unzip -q raw/presto.zip -d raw/presto
          python - <<'PY'
          import json, pathlib
          raw=pathlib.Path('raw/presto'); out=pathlib.Path('out/presto'); counts={}
          for split in ('train','dev','test'):
              matches=list(raw.rglob(f'presto_{split}.jsonl'))
              if not matches: raise SystemExit(f'missing PRESTO {split}')
              n=0
              with matches[0].open(encoding='utf-8') as fi,(out/f'{split}.jsonl').open('w',encoding='utf-8') as fo:
                  for line in fi:
                      r=json.loads(line)
                      locale=str(r.get('metadata',{}).get('locale',''))
                      if not locale.lower().startswith('en'): continue
                      fo.write(json.dumps(r,ensure_ascii=False)+'\n'); n+=1
              counts[split]=n
          expected={'train':47806,'dev':14288,'test':33577}
          if counts != expected: raise SystemExit(f'unexpected PRESTO English counts {counts}, expected {expected}')
          (out/'manifest.json').write_text(json.dumps({'dataset':'PRESTO English','source':'https://storage.googleapis.com/gresearch/presto/presto_v1.zip','counts':counts},indent=2))
          print(counts)
          PY
          find out/presto -type f -print0 | sort -z | xargs -0 sha256sum > out/presto/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sense-semantic-presto-en
          path: out/presto/
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
